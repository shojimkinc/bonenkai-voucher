<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>抽選番号</title>
<style>
:root{--bg:#FFFFFF;--ink:#333333;--sub:#6B6B6B;--pale:#F3F5F8;--main:#1F4E79;--accent:#E8740C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN","Segoe UI","Leelawadee UI","Noto Sans Thai",sans-serif;line-height:1.7;overflow-wrap:break-word;padding:24px 16px 40px}
.num{font-family:"Segoe UI","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto}
.event{font-size:14px;color:var(--sub)}
h1{font-size:28px;font-weight:700;margin-top:4px;line-height:1.4}
.sub{display:block;font-size:.7em;font-weight:500;color:var(--sub);line-height:1.5}
.card{background:var(--pale);border-radius:8px;padding:24px 20px;margin-top:20px}
.lbl{font-size:16px;font-weight:700;color:var(--main)}
.lbl span{font-weight:500;color:var(--ink);margin-left:8px}
.no{margin-top:8px;font-size:120px;font-weight:700;line-height:1;color:var(--accent)}
.no small{font-size:36px;margin-left:4px}
.name{font-size:24px;font-weight:700;margin-top:12px}
.at{font-size:14px;color:var(--sub);margin-top:8px}
.howto{margin-top:24px;font-size:16px;line-height:1.9}
.howto b{color:var(--main)}
.howto p+p{margin-top:12px;font-size:16px;line-height:1.8}
.err{margin-top:24px;font-size:16px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="event">宮川工業 忘年会 2026</div>
  <h1>抽選番号<span class="sub">Lucky draw number · หมายเลขจับรางวัล</span></h1>
</div>
<script>
(() => {
  const app = document.getElementById("app");
  let n = "", w = "", t = "";
  try {
    const d = new URLSearchParams(location.hash.slice(1)).get("d");
    const bin = atob(d.replace(/-/g, "+").replace(/_/g, "/"));
    [n, w, t] = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
  } catch(e){}
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  if (!n){
    app.insertAdjacentHTML("beforeend", `<p class="err">番号が読み取れませんでした。受付でもう一度QRコードを読み込んでください。<br><br>Could not read your number. Please scan the QR code at the reception again.<br>ไม่สามารถอ่านหมายเลขได้ กรุณาสแกน QR โค้ดที่จุดลงทะเบียนอีกครั้ง</p>`);
    return;
  }
  document.title = `抽選番号 ${n}番`;
  app.insertAdjacentHTML("beforeend", `
    <div class="card">
      <div class="lbl">あなたの番号<span>Your number · หมายเลขของคุณ</span></div>
      <div class="no num">${esc(n)}<small>番</small></div>
      ${w ? `<div class="name">${esc(w)} さん</div>` : ""}
      ${t ? `<div class="at num">受付 ${esc(t)}</div>` : ""}
    </div>
    <div class="howto">
      <p>景品抽選では、この番号が画面に出たら当選です。<br><b>この画面のスクリーンショット</b>を撮っておいてください。</p>
      <p>If this number appears on the screen during the lucky draw, you win! Please take a screenshot of this page.</p>
      <p>ถ้าหมายเลขนี้ขึ้นบนจอระหว่างจับรางวัล แสดงว่าคุณได้รับรางวัล! กรุณาแคปหน้าจอนี้เก็บไว้</p>
    </div>`);
})();
</script>
</body>
</html>
