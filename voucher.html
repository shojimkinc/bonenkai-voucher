<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>当選証</title>
<style>
:root{--bg:#FFFFFF;--ink:#333333;--sub:#6B6B6B;--pale:#F3F5F8;--main:#1F4E79;--accent:#E8740C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN","Segoe UI","Leelawadee UI","Noto Sans Thai",sans-serif;line-height:1.7;overflow-wrap:break-word;padding:24px 16px 40px}
.num{font-family:"Segoe UI","Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto}
.event{font-size:14px;color:var(--sub)}
h1{font-size:28px;font-weight:700;margin-top:4px}
.card{background:var(--pale);border-radius:8px;padding:24px 20px;margin-top:20px}
.rank{font-size:22px;font-weight:700;color:var(--main)}
.prize{font-size:26px;font-weight:700;line-height:1.4;margin-top:2px}
.no{margin-top:20px;font-size:88px;font-weight:700;line-height:1;color:var(--accent)}
.no small{font-size:28px;margin-left:4px}
.name{font-size:24px;font-weight:700;margin-top:8px}
.winner{margin-top:20px;font-size:40px;font-weight:700;line-height:1.3;color:var(--accent);word-break:keep-all;overflow-wrap:break-word}
.winner small{font-size:.5em;margin-left:4px}
.wno{margin-right:.4em;white-space:nowrap}
.wno small{margin:0 .1em 0 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin-top:20px;font-size:15px}
dt{color:var(--sub)}
dd{font-weight:700}
.code{font-size:20px;letter-spacing:.12em}
.howto{margin-top:24px;font-size:15px;line-height:1.9}
.howto b{color:var(--main)}
.err{margin-top:24px;font-size:16px}
.tr{font-size:17px;font-weight:500;color:var(--ink);margin-left:8px}
.photo{display:block;width:100%;max-height:260px;object-fit:contain;background:#FFFFFF;border-radius:6px;margin:4px 0 16px}
.psub{font-size:19px;color:var(--ink);line-height:1.5;margin-top:4px}
.sub{display:block;font-size:.7em;font-weight:500;color:var(--sub);line-height:1.5}
.howto p+p{margin-top:12px;color:var(--ink);font-size:16px;line-height:1.8}
dt .sub{font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="event">宮川工業 忘年会 2026</div>
  <h1>当選証<span class="sub">Prize Certificate · ใบรับรางวัล</span></h1>
</div>
<script>
(() => {
  const app = document.getElementById("app");
  let r = "", p = "", n = "", w = "", t = "", c = "";
  try {
    const d = new URLSearchParams(location.hash.slice(1)).get("d");
    const bin = atob(d.replace(/-/g, "+").replace(/_/g, "/"));
    [r, p, n, w, t, c] = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0))));
  } catch(e){}
  // 賞と既定の景品の英語・タイ語（抽選画面と同じ内容）
  const PRIZE_TR = {
    "クノール カップスープ 24食": ["Knorr cup soup (24 servings)", "ซุปถ้วย Knorr 24 ซอง"],
    "洗剤ギフトセット（アリエール＆ジョイ）": ["Detergent gift set (Ariel & Joy)", "ชุดของขวัญผงซักฟอก (Ariel & Joy)"],
    "充電式カイロ": ["Rechargeable hand warmer", "เครื่องอุ่นมือแบบชาร์จได้"],
    "ロイズ バトンクッキー": ["ROYCE' baton cookies", "คุกกี้ ROYCE'"],
    "LAMY ボールペン（ジェットストリーム）": ["LAMY ballpoint pen (Jetstream inside)", "ปากกาลูกลื่น LAMY (ไส้ Jetstream)"],
    "ヨックモック シガール 30本": ["YOKU MOKU Cigare cookies (30)", "คุกกี้ YOKU MOKU Cigare 30 ชิ้น"],
    "サーモス 水筒 500ml": ["THERMOS vacuum bottle (500 ml)", "กระติกน้ำสุญญากาศ THERMOS 500 มล."],
    "充電式湯たんぽ": ["Rechargeable hot water bottle", "กระเป๋าน้ำร้อนแบบชาร์จได้"],
    "はちみつ食べ比べ 6種": ["Japanese honey tasting set (6 kinds)", "ชุดชิมน้ำผึ้งญี่ปุ่น 6 ชนิด"],
    "モバイルバッテリー（Anker）": ["Anker power bank", "พาวเวอร์แบงก์ Anker"],
    "スチーム式加湿器": ["Steam humidifier", "เครื่องเพิ่มความชื้นแบบไอน้ำ"],
    "でかランタン（パナソニック）": ["Panasonic large LED lantern", "ตะเกียง LED ขนาดใหญ่ Panasonic"],
    "スマートバンド（Xiaomi）": ["Xiaomi Smart Band", "สมาร์ทแบนด์ Xiaomi"],
    "洗える電気毛布": ["Washable electric blanket", "ผ้าห่มไฟฟ้าซักได้"],
    "魚沼産コシヒカリ 5kg": ["Uonuma Koshihikari rice (5 kg)", "ข้าวโคชิฮิคาริ อุโอนุมะ 5 กก."],
    "セラミックファンヒーター": ["Ceramic fan heater", "พัดลมทำความร้อนเซรามิก"],
    "BRUNO ホットプレート": ["BRUNO compact hot plate", "เตาไฟฟ้า BRUNO"],
    "ふとん乾燥機（アイリスオーヤマ）": ["Futon dryer (IRIS OHYAMA)", "เครื่องอบฟูก IRIS OHYAMA"]
  };
  // 景品の写真（Amazon の商品写真を表示するだけ。このページには写真を置かない）
  const PRIZE_IMG = {
    "クノール カップスープ 24食": "81oFWDmiGTL._AC_SL1200_",
    "洗剤ギフトセット（アリエール＆ジョイ）": "61NDwtvn24L._AC_SL1000_",
    "充電式カイロ": "51gCNFM%2BS2L._AC_SL1500_",
    "ロイズ バトンクッキー": "710M-lXk9wL._AC_SL1500_",
    "LAMY ボールペン（ジェットストリーム）": "515WI8ZcP4L._AC_SL1500_",
    "ヨックモック シガール 30本": "61BYvtdleTL._AC_SL1000_",
    "サーモス 水筒 500ml": "41akLAS8YrL._AC_SL1500_",
    "充電式湯たんぽ": "71vMrIcwXrL._AC_SL1500_",
    "はちみつ食べ比べ 6種": "71iu4h0WE1L._AC_SL1500_",
    "モバイルバッテリー（Anker）": "61SeOo7fuvL._AC_SL1500_",
    "スチーム式加湿器": "41JZhAUY6TL._AC_SL1000_",
    "でかランタン（パナソニック）": "61qOJrN7gQL._AC_SL1500_",
    "スマートバンド（Xiaomi）": "61CLwZfr%2BYL._AC_SL1500_",
    "洗える電気毛布": "71Y1deYUTQL._AC_SL1500_",
    "魚沼産コシヒカリ 5kg": "71MwP8IRTsL._AC_SL1500_",
    "セラミックファンヒーター": "41QNdnxBrNL._AC_SL1000_",
    "BRUNO ホットプレート": "612XVAwKtTL._AC_SL1500_",
    "ふとん乾燥機（アイリスオーヤマ）": "514iFE5DfVL._AC_SL1000_"
  };
  const RANK_TR = {"特賞": ["Grand Prize", "รางวัลใหญ่"], "ブービー賞": ["Booby Prize", "รางวัลรองบ๊วย"], "飛び賞": ["Lucky Number Prize", "รางวัลเลขพิเศษ"], "社長賞": ["President's Prize", "รางวัลประธาน"]};
  function rankTr(x){
    x = (x || "").trim();
    const m = x.match(/^(\d+)等$/);
    if (m){ const k = +m[1], t = k % 100; const s = t >= 11 && t <= 13 ? "th" : ({1: "st", 2: "nd", 3: "rd"})[k % 10] || "th"; return [`${k}${s} Prize`, `รางวัลที่ ${k}`]; }
    return RANK_TR[x] || null;
  }
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  if (!p || !n){
    app.insertAdjacentHTML("beforeend", `<p class="err">当選の情報が読み取れませんでした。会場の画面に出ているQRコードを、もう一度読み込んでください。<br><br>Could not read the prize information. Please scan the QR code on the screen again.<br>ไม่สามารถอ่านข้อมูลรางวัลได้ กรุณาสแกน QR โค้ดบนจออีกครั้ง</p>`);
    return;
  }
  document.title = `当選証 ${r || ""} No.${n}${w ? " " + w : ""}`;
  app.insertAdjacentHTML("beforeend", `
    <div class="card">
      ${PRIZE_IMG[p] ? `<img class="photo" src="https://m.media-amazon.com/images/I/${PRIZE_IMG[p]}.jpg" alt="${esc(p)}" onerror="this.remove()">` : ""}
      <div class="rank">${esc(r || "")}${rankTr(r) ? `<span class="tr">${esc(rankTr(r).join(" · "))}</span>` : ""}</div>
      <div class="prize">${esc(p)}</div>
      ${PRIZE_TR[p] ? `<div class="psub">${esc(PRIZE_TR[p].join(" ／ "))}</div>` : ""}
      <div class="winner">${n ? `<span class="wno num"><small>No.</small>${esc(n)}</span>` : ""}${w ? `${esc(w)}<small>さん</small>` : ""}</div>
      <dl>
        ${t ? `<dt>抽選日時<span class="sub">Drawn at · เวลาที่จับรางวัล</span></dt><dd class="num">${esc(t)}</dd>` : ""}
        <dt>照合コード<span class="sub">Code · รหัสยืนยัน</span></dt><dd class="num code">${esc(c)}</dd>
      </dl>
    </div>
    <div class="howto">
      <p>おめでとうございます！<br>
      <b>交換するときにこの画面を見せてください。</b></p>
      <p>Congratulations! Please show this screen when you receive your prize.</p>
      <p>ยินดีด้วย! กรุณาแสดงหน้าจอนี้ตอนรับของรางวัล</p>
    </div>`);
})();
</script>
</body>
</html>
